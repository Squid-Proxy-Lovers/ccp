name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish a nightly from main after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !inputs.nightly }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run check
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build reviewed dependencies
        run: cargo build --release --workspace --locked
      - name: Workspace tests
        run: make test
      - name: Docker installer regressions
        run: make installer-tests
      - name: Nightly packaging and publication regressions
        run: make nightly-tests
      - name: Hidden enrollment paste on a real isolated terminal
        run: python3 tests/client_link_prompt.py --client target/release/client
      - name: CLI integration
        run: bash tests/run.sh --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccp-smoke-binaries
          retention-days: 1
          path: |
            target/release/server
            target/release/client

  macos-client:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build reviewed dependencies
        run: cargo build --release --workspace --locked
      - name: Client tests
        run: cargo test --package client --locked -- --test-threads=1
      - name: CLI integration
        run: bash tests/run.sh --skip-build
      - run: python -m pip install ./mcp
      - name: Real MCP to CLI to TLS server
        env:
          CCP_SERVER_BIN: ${{ github.workspace }}/target/release/server
          CCP_CLIENT_BIN: ${{ github.workspace }}/target/release/client
        run: |
          python tests/mcp_smoke.py
          python tests/workspace_mcp_smoke.py

  windows-client:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # The client's server dev-dependency embeds the panel during tests.
      - name: Build embedded panel from locked source
        shell: pwsh
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix crates/server/web run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CCP_PANEL_DIST=$env:GITHUB_WORKSPACE/crates/server/web/dist" >> $env:GITHUB_ENV
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: x86_64-pc-windows-msvc
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Client tests
        run: cargo test --package client --locked -- --test-threads=1
      - name: Build Windows client only
        run: cargo build --release --locked -p client --target x86_64-pc-windows-msvc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Lint PowerShell installer and regressions
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $issues = @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error)
          $issues += @(Invoke-ScriptAnalyzer -Path tests/windows_install.ps1 -Severity Warning,Error)
          if ($issues.Count) { $issues | Format-Table; throw 'PowerShell lint failed' }
      - name: Isolated installer regressions on PowerShell 7
        shell: pwsh
        run: ./tests/windows_install.ps1
      - name: Isolated installer regressions on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows_install.ps1
      - name: Package Windows client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/client.exe dist/ccp-client-windows-x86_64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-windows-x86_64
          retention-days: 1
          path: dist/ccp-client-windows-x86_64.exe
          if-no-files-found: error

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run check
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: make lint-rust
      - run: make lint-docs

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          build-warnings: ""
      - run: make fmt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run check
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: "1.89.0"
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: cargo +1.89.0 check --workspace --locked

  source-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked frontend test dependencies
        run: npm ci --prefix crates/server/web --ignore-scripts
      - run: make tools
      - run: python -m pip install -e ./mcp
      - run: make lint-python lint-types lint-deadcode lint-deps lint-shell lint-workflows lint-secrets lint-text
      - name: Check final main commit attribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/check-attribution.py --event "$GITHUB_EVENT_PATH"
      - name: Quality gate regressions
        run: make quality-tests
      - name: Secret history
        run: .lint-tools/bin/gitleaks git --redact --no-banner --config .gitleaks.toml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run check
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: rustup component add llvm-tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: make tools
      - run: make coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: make tools
      - run: python -m pip install -e ./mcp
      - run: make security

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Audit the complete locked frontend build dependency graph
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          node --test tests/frontend_dependency.mjs
          npm --prefix crates/server/web audit

  compat:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run check
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccp-smoke-binaries
          path: ${{ runner.temp }}/ccp-current
      - run: chmod +x "$RUNNER_TEMP/ccp-current/server" "$RUNNER_TEMP/ccp-current/client"
      - name: Current client and persistence smoke
        run: python3 tests/dependency_compat.py --server "$RUNNER_TEMP/ccp-current/server" --client "$RUNNER_TEMP/ccp-current/client"
      - name: Compare API versions with PR base
        id: versions
        if: github.event_name == 'pull_request'
        env:
          CCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ccp-baseline" "$CCP_BASE_SHA"
          python3 - <<'PY'
          import os, pathlib, re
          pairs = [("crates/protocol/src/lib.rs", "PROTOCOL_VERSION"), ("crates/server/src/init.rs", "SCHEMA_VERSION")]
          same = True
          for path, name in pairs:
              pattern = rf"pub const {name}:\s*u32\s*=\s*(\d+)"
              current = re.search(pattern, pathlib.Path(path).read_text()).group(1)
              old = re.search(pattern, (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ccp-baseline" / path).read_text()).group(1)
              same = same and current == old
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"same_api={str(same).lower()}\n")
          if not same:
              print("Protocol/schema migration: cross-version maintenance check does not apply.")
          PY
      - name: Build previous dependency set
        if: steps.versions.outputs.same_api == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/ccp-baseline/crates/server/build.rs" ] && [ -f "$RUNNER_TEMP/ccp-baseline/crates/server/web/package.json" ]; then
            npm ci --prefix "$RUNNER_TEMP/ccp-baseline/crates/server/web" --ignore-scripts
          fi
          env -u CCP_PANEL_DIST cargo build --release --locked --manifest-path "$RUNNER_TEMP/ccp-baseline/Cargo.toml" --target-dir "$RUNNER_TEMP/ccp-baseline-target" -p server -p client
      - name: Old/new clients and upgrade/downgrade persistence
        if: steps.versions.outputs.same_api == 'true'
        run: python3 tests/dependency_compat.py --server "$RUNNER_TEMP/ccp-current/server" --client "$RUNNER_TEMP/ccp-current/client" --old-server "$RUNNER_TEMP/ccp-baseline-target/release/server" --old-client "$RUNNER_TEMP/ccp-baseline-target/release/client"

  mcp:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            fastmcp: "==2.14.7"
          - python: "3.10"
            fastmcp: ">=4,<5"
          - python: "3.13"
            fastmcp: ">=3,<4"
          - python: "3.13"
            fastmcp: ">=4,<5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccp-smoke-binaries
          path: ${{ runner.temp }}/ccp-current
      - run: chmod +x "$RUNNER_TEMP/ccp-current/server" "$RUNNER_TEMP/ccp-current/client"
      - run: python -m pip install ./mcp "fastmcp${{ matrix.fastmcp }}"
      - name: Real MCP to CLI to TLS server
        env:
          CCP_SERVER_BIN: ${{ runner.temp }}/ccp-current/server
          CCP_CLIENT_BIN: ${{ runner.temp }}/ccp-current/client
        run: |
          python tests/mcp_smoke.py
          python tests/workspace_mcp_smoke.py

  build:
    needs: [test, clippy, fmt, source-lint, coverage, msrv, audit, frontend-audit, compat, mcp, macos-client, windows-client]
    env:
      CCP_GLIBC_FLOOR: "2.28"
      ZIG_VERSION: "0.17.1"
      CARGO_ZIGBUILD_VERSION: "0.24.1"
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
            docker_platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-aarch64
            docker_platform: linux/arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build embedded panel from locked source
        run: |
          npm ci --prefix crates/server/web --ignore-scripts
          npm --prefix crates/server/web run check
          npm --prefix crates/server/web run build
          printf 'CCP_PANEL_DIST=%s\n' "$GITHUB_WORKSPACE/crates/server/web/dist" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          build-warnings: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-key: ${{ runner.os == 'Linux' && format('{0}-glibc-{1}-zig-{2}-zigbuild-{3}', matrix.target, env.CCP_GLIBC_FLOOR, env.ZIG_VERSION, env.CARGO_ZIGBUILD_VERSION) || '' }}
      - name: Install pinned Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/ccp-linux-tools"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          # Both tool tarballs assume an x86_64 Linux runner.
          zig_dir="zig-x86_64-linux-$ZIG_VERSION"
          zigbuild_dir="cargo-zigbuild-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 --output "$zig_dir.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/$zig_dir.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 --output "$zigbuild_dir.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$CARGO_ZIGBUILD_VERSION/$zigbuild_dir.tar.xz"
          # Dependabot does not track these archives. Update the versions and take
          # the SHA-256 values from ziglang.org/download/index.json and the GitHub release asset.
          printf '%s  %s\n' \
            3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a "$zig_dir.tar.xz" \
            f09b180a517af0e4dd4bffc921bb88e5ab705452a9dd948c61e489b3020c68c2 "$zigbuild_dir.tar.xz" \
            | sha256sum --check --strict
          tar -xJf "$zig_dir.tar.xz"
          tar -xJf "$zigbuild_dir.tar.xz"
          printf '%s\n' "$tool_dir/$zig_dir" "$tool_dir/$zigbuild_dir" >> "$GITHUB_PATH"
      - name: Build Linux binaries
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release --workspace --locked --target "$TARGET.$CCP_GLIBC_FLOOR"
      - name: Build macOS binaries
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --workspace --locked --target "$TARGET"
      - name: Package binaries
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          # cargo-zigbuild forwards the unsuffixed target triple to Cargo.
          cp "target/$TARGET/release/server" "dist/ccp-server-$PLATFORM"
          cp "target/$TARGET/release/client" "dist/ccp-client-$PLATFORM"
      - name: Check packaged Linux binaries for glibc compatibility
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/check-glibc.py --max-glibc "$CCP_GLIBC_FLOOR" "dist/ccp-server-$PLATFORM" "dist/ccp-client-$PLATFORM"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        with:
          platforms: arm64
          # Dependabot does not track this image input. Update the tag and get
          # its index digest with docker buildx imagetools inspect.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Smoke test packaged Linux binaries on the glibc floor
        if: runner.os == 'Linux'
        env:
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          PLATFORM: ${{ matrix.platform }}
          # Dependabot does not track this image variable. Get the selected tag's
          # index digest with docker buildx imagetools inspect.
          GLIBC_SMOKE_IMAGE: almalinux:8@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342
        run: |
          docker run --rm --platform "$DOCKER_PLATFORM" --network none \
            --mount "type=bind,source=$PWD/dist,target=/dist,readonly" \
            --env CCP_GLIBC_FLOOR --env PLATFORM \
            "$GLIBC_SMOKE_IMAGE" bash -euc '
              glibc_version=$(getconf GNU_LIBC_VERSION)
              printf "%s\n" "$glibc_version"
              test "$glibc_version" = "glibc $CCP_GLIBC_FLOOR"
              "/dist/ccp-server-$PLATFORM" --help
              "/dist/ccp-client-$PLATFORM" --help
            '
      - name: Test TLS and persistence with packaged Linux x86_64 binaries
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 tests/dependency_compat.py --server "dist/ccp-server-$PLATFORM" --client "dist/ccp-client-$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.platform }}
          retention-days: 1
          path: dist/

  package:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Package matching MCP source and build metadata
        run: |
          git archive --format=tar.gz --prefix=ccp-mcp/ "${GITHUB_SHA}:mcp" > dist/ccp-mcp.tar.gz
          python scripts/nightly.py prepare --dist dist --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release-identity:
    needs: [package]
    if: >-
      github.repository == 'Squid-Proxy-Lovers/ccp' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.nightly))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      tag: ${{ steps.identity.outputs.tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      make_latest: ${{ steps.identity.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Validate release identity before attestation or publishing
        id: identity
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/release_tag.py --tag "${GITHUB_REF#refs/tags/}" --output "$GITHUB_OUTPUT"
          else
            printf 'channel=nightly\ntag=nightly-%s-%s\n' "$(date -u +%Y-%m-%d)" "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi

  provenance:
    needs: [package, release-identity]
    if: >-
      github.repository == 'Squid-Proxy-Lovers/ccp' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.nightly))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Attest the matching release contract
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/ccp-release.json
      - name: Verify publisher policy before making the bundle available
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.release-identity.outputs.channel }}
          RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
        run: |
          cp "$ATTESTATION_BUNDLE" dist/ccp-provenance.json
          python scripts/release_contract.py --directory dist --channel "$CHANNEL" --tag "$RELEASE_TAG" --platform linux-x86_64 > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance
          path: dist/ccp-provenance.json
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [package, release-identity, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: dist
      # v3.0.3; retain the existing asset-update behavior on tag reruns.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # zizmor: ignore[superfluous-actions]
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.release-identity.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.release-identity.outputs.make_latest }}

  docker:
    needs: [test, clippy, fmt, source-lint, coverage, msrv, audit, frontend-audit, compat, mcp, macos-client, windows-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ccp-ci:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Container startup and health
        run: |
          docker run --rm -d --name ccp-ci-smoke -e CCP_AUTH_LISTENER_ADDR=127.0.0.1:1337 -e CCP_MTLS_LISTENER_ADDR=127.0.0.1:1338 "ccp-ci:$GITHUB_SHA" dependency-smoke
          trap 'docker rm -f ccp-ci-smoke >/dev/null 2>&1 || true' EXIT
          for _attempt in $(seq 1 40); do
            if docker exec ccp-ci-smoke server health dependency-smoke; then
              exit 0
            fi
            sleep 0.25
          done
          exit 1
      - name: Default first-boot setup and persistent restart
        run: python3 tests/docker_first_boot.py --image "ccp-ci:$GITHUB_SHA"
      - name: Save tested image for publication
        run: docker save "ccp-ci:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/ccp-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}/ccp-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  docker-publish:
    needs: [docker, package, release-identity, provenance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image to validated tags
        env:
          CHANNEL: ${{ needs.release-identity.outputs.channel }}
          RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
        run: |
          case "$CHANNEL" in
            stable) alias=latest ;;
            rc) alias="$RELEASE_TAG" ;;
            *) exit 1 ;;
          esac
          docker load --input image/ccp-image.tar.gz
          docker tag "ccp-ci:$GITHUB_SHA" "ghcr.io/squid-proxy-lovers/ccp:$GITHUB_SHA"
          docker push "ghcr.io/squid-proxy-lovers/ccp:$GITHUB_SHA"
          if [ "$CHANNEL" = stable ]; then
            docker tag "ccp-ci:$GITHUB_SHA" "ghcr.io/squid-proxy-lovers/ccp:$RELEASE_TAG"
            docker push "ghcr.io/squid-proxy-lovers/ccp:$RELEASE_TAG"
          fi
          docker tag "ccp-ci:$GITHUB_SHA" "ghcr.io/squid-proxy-lovers/ccp:$alias"
          docker push "ghcr.io/squid-proxy-lovers/ccp:$alias"

  nightly:
    needs: [package, docker, provenance]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or resume the nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/nightly.py publish --dist dist --image image/ccp-image.tar.gz
