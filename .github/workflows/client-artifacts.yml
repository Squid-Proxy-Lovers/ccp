name: Client artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  client:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            artifact: ccp-client-darwin-x86_64
            source: target/release/client
          - runner: macos-15
            artifact: ccp-client-darwin-aarch64
            source: target/release/client
          - runner: ubuntu-24.04
            artifact: ccp-client-linux-x86_64
            target: x86_64-unknown-linux-gnu
            source: target/bookworm/x86_64-unknown-linux-gnu/release/client
          - runner: ubuntu-24.04-arm
            artifact: ccp-client-linux-aarch64
            target: aarch64-unknown-linux-gnu
            source: target/bookworm/aarch64-unknown-linux-gnu/release/client
          - runner: windows-2025
            artifact: ccp-client-windows-x86_64.exe
            source: target/release/client.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - if: runner.os != 'Linux'
        run: cargo build --locked --release -p client
      - if: runner.os == 'Linux'
        run: bash scripts/ci-build-linux.sh '${{ matrix.target }}' client
      - shell: bash
        run: cp '${{ matrix.source }}' '${{ matrix.artifact }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist --outdir dist mcp
      - shell: bash
        run: |
          mkdir -p downloads
          cp dist/ccp_mcp_server-*.tar.gz downloads/ccp-mcp.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ccp-mcp.tar.gz
          path: downloads/ccp-mcp.tar.gz
