version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    groups:
      compatible-rust:
        patterns: ["*"]
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      compatible-python:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: debian
        versions: [">=13"]
    open-pull-requests-limit: 5

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
