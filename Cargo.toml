[workspace]
members = [
    "crates/protocol",
    "crates/server",
    "crates/client",
    "tests",
]
resolver = "2"

[workspace.package]
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
