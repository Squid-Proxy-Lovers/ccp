target-version = "py310"
line-length = 100
required-version = "==0.16.10"
extend-exclude = ["handoff", "audit-context", ".lint-tools"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "S", "RUF100"]

[lint.per-file-ignores]
# Assertions intentionally make the smoke tests fail when a contract breaks.
"tests/*.py" = ["S101"]
